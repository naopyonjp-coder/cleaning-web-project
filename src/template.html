<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>客室清掃指示書 WEB版（テスト）</title>
<style>
:root{
  --navy:#0c2d55;--ink:#12243d;--muted:#6c7d92;--line:#dfe8f2;--bg:#f4f7fb;
  --blue:#1684ef;--blue-soft:#e8f3ff;--green:#1fa65a;--green-soft:#e7f7ec;
  --pink:#c92f69;--pink-soft:#ffe8f0;--yellow:#7b5d00;--yellow-soft:#fff3c5;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}
button{font:inherit}
.today{display:block;margin-top:14px;font-size:17px;font-weight:850;color:var(--navy)}
.languages{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.languages button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--navy);font-weight:850;cursor:pointer}
.languages button[aria-pressed="true"]{background:var(--navy);color:white}
.languages button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.item span{min-width:0;overflow-wrap:anywhere}.item b{flex-shrink:0}
.navline .title{min-width:0;overflow-wrap:anywhere}.back{flex-shrink:0}
.demo-notice{margin:0;padding:10px;border:1px solid #f4e0a0;border-radius:12px;background:var(--yellow-soft);color:var(--yellow);font-size:12px;line-height:1.5}
.headrow{flex-wrap:wrap}
.app{max-width:620px;margin:auto;min-height:100vh;padding:12px 12px 28px}
.view{display:none}.view.active{display:block}
.top{padding:28px 4px 18px;text-align:center}
.top h1{margin:0;color:var(--navy);font-size:28px;font-weight:950;letter-spacing:.02em}
.top .sub{margin-top:5px;color:#56708e;font-size:14px;font-weight:800}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.pickbtn{border:0;border-radius:22px;padding:22px 14px;box-shadow:0 10px 26px rgba(31,65,104,.10);
  font-weight:950;font-size:23px;text-align:left;cursor:pointer}
.pickbtn.blue{background:linear-gradient(145deg,#eaf5ff,#d8ecff);color:#1378d7}
.pickbtn.green{background:linear-gradient(145deg,#eefaf2,#d9f1e1);color:#158b4b}
.pickbtn span{display:block}.pickbtn small{font-size:12px;margin-top:7px;color:#5e7188}
.arrow{float:right;font-size:28px}
.homefoot{margin-top:24px;text-align:center;color:#8390a0;font-size:12px}

.sticky{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.94);backdrop-filter:blur(12px);padding:7px 0 9px}
.navline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{border:0;background:transparent;color:#1678dc;font-weight:900;padding:9px 4px;cursor:pointer}
.title{font-weight:950;color:var(--navy)}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e6edf5;border-radius:13px;padding:3px;margin-top:8px}
.switch button{border:0;background:transparent;border-radius:10px;padding:10px 8px;font-weight:900;color:#38516e;cursor:pointer}
.switch .active.blue{background:var(--blue);color:#fff}.switch .active.green{background:var(--green);color:#fff}
.floors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:8px}
.floors button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--navy);font-weight:900;cursor:pointer}
.floors.blue button{border-color:#6bb0f2;color:#0d5ca8}
.floors.green button{border-color:#69c68a;color:#14743e}
.floors button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.headcard{border-radius:18px;padding:14px;margin:10px 0 12px;color:white;box-shadow:0 8px 22px rgba(20,61,103,.09)}
.headcard.blue{background:linear-gradient(100deg,#1684ef,#75baff)}
.headcard.green{background:linear-gradient(100deg,#1fa65a,#72c991)}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bname{font-size:24px;font-weight:950}.date{font-size:13px;font-weight:850}
.stats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.92);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:950;color:#31435a}
.stat.out{color:#c32d68}.stat.stay{color:#1471c4}.stat.ck{color:#7e6200}

.rooms{display:flex;flex-direction:column;gap:11px}
.room{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;box-shadow:0 5px 16px rgba(27,61,98,.055)}
.room.blue{border-left:5px solid #6bb0f2}.room.green{border-left:5px solid #69c68a}
.rtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.roomno{font-size:28px;font-weight:950;line-height:1}
.room.blue .roomno{color:#0d5ca8}.room.green .roomno{color:#14743e}
.meta{margin-top:5px;color:#718198;font-size:12px;font-weight:800}
.inpill{border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}
.inpill.on{background:#e5f3ff;color:#116fc6}.inpill.off{background:#f0f2f5;color:#7b8794}

.people{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.pbox{background:#f7f9fc;border:1px solid #edf1f5;border-radius:12px;text-align:center;padding:8px 3px}
.pbox span{display:block;color:#718198;font-size:10px;font-weight:850;margin-bottom:2px}.pbox b{font-size:20px}

.items{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8fafc;border:1px solid #edf1f5;border-radius:12px;padding:9px 10px}
.item span{font-size:12px;color:#64758c;font-weight:850}.item b{font-size:18px}
.item.wide{grid-column:1/-1}
.mouthdiff{background:#fff8dd;border-color:#f4e0a0}

.notes{margin-top:10px;border-radius:13px;padding:10px 12px;background:var(--pink-soft);color:var(--pink);font-size:13px;font-weight:900;line-height:1.55}
.notes.yellow{background:var(--yellow-soft);color:var(--yellow)}
.notes ul{margin:0;padding-left:18px}
.empty{display:none}
@media(max-width:390px){
  .app{padding:9px 9px 24px}.top h1{font-size:25px}.pickbtn{font-size:20px;padding:20px 12px}
  .room{padding:12px}.roomno{font-size:26px}.item{padding:8px 9px}
}
@media print{
  body{background:white}.app{max-width:none}.sticky,.home{display:none!important}.detail{display:block!important}
  .room{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
  <p class="demo-notice" role="note" data-i18n="notice">表示確認用の架空データです。実際の清掃には使用しないでください。</p>
  <section id="home" class="view active home">
    <div class="top">
      <h1 data-i18n="heading">客室清掃指示書</h1>
      <div class="sub" data-i18n="subtitle">WEB版 · テストデータ</div>
      <time id="today" class="today" aria-live="polite"></time>
      <div class="languages" role="group" aria-label="言語選択" data-i18n-aria="language">
        <button id="lang-ja" lang="ja" onclick="setLanguage('ja')" aria-pressed="true" data-i18n="japanese">日本語</button>
        <button id="lang-ne" lang="ne" onclick="setLanguage('ne')" aria-pressed="false" data-i18n="nepali">नेपाली</button>
      </div>
      <div class="pick">
        <button class="pickbtn blue" onclick="openBuilding('1')">
          <span><span data-i18n="building1">1号館</span><span class="arrow">›</span></span>
          <small>1101〜1405</small>
        </button>
        <button class="pickbtn green" onclick="openBuilding('2')">
          <span><span data-i18n="building2">2号館</span><span class="arrow">›</span></span>
          <small>2101〜2407</small>
        </button>
      </div>
      <div class="homefoot" data-i18n="chooseBuilding">見たい号館をタップしてください</div>
    </div>
  </section>

  <section id="detail" class="view detail">
    <div id="sticky" class="sticky">
      <div class="navline">
        <button class="back" onclick="goHome()" data-i18n="back">‹ 戻る</button>
        <div class="title" data-i18n="title">客室清掃指示書 WEB版</div>
        <div style="width:44px"></div>
      </div>
      <div class="switch">
        <button id="s1" class="blue" onclick="openBuilding('1')" data-i18n="building1">1号館</button>
        <button id="s2" class="green" onclick="openBuilding('2')" data-i18n="building2">2号館</button>
      </div>
      <nav id="floors" class="floors" aria-label="階数選択" data-i18n-aria="floors">
        <button onclick="jumpToFloor('1')" data-i18n="floor1">1階</button>
        <button onclick="jumpToFloor('2')" data-i18n="floor2">2階</button>
        <button onclick="jumpToFloor('3')" data-i18n="floor3">3階</button>
        <button onclick="jumpToFloor('4')" data-i18n="floor4">4階</button>
      </nav>
    </div>

    <div id="headcard" class="headcard"></div>
    <div id="rooms" class="rooms"></div>
  </section>
</div>

<script>
const DATA = __DEMO_DATA__;
let current = "1";
const TEXT = {
  ja: {heading:"客室清掃指示書",title:"客室清掃指示書 WEB版",subtitle:"WEB版 · テストデータ",
    notice:"表示確認用の架空データです。実際の清掃には使用しないでください。",
    language:"言語選択",japanese:"日本語",nepali:"नेपाली",building1:"1号館",building2:"2号館",
    chooseBuilding:"見たい号館をタップしてください",back:"‹ 戻る",floors:"階数選択",
    floor1:"1階",floor2:"2階",floor3:"3階",floor4:"4階",type:"タイプ",capacity:"定数",checkIn:"イン",
    yes:"あり",no:"なし",adult:"大",middle:"中",child:"小",infant:"幼",mouth:"お口",slippers:"スリッパ",
    toothbrush:"歯ブラシ",amenities:"アメニティ",samue:"サムエ",towel:"タオルセット",out:"OUT",stay:"STAY",ck:"CK",test:"テスト"},
  ne: {heading:"कोठा सफाइ निर्देशन",title:"कोठा सफाइ निर्देशन · वेब संस्करण",subtitle:"वेब संस्करण · परीक्षण डेटा",
    notice:"यो प्रदर्शन जाँचका लागि काल्पनिक डेटा हो। वास्तविक सफाइमा प्रयोग नगर्नुहोस्।",
    language:"भाषा चयन",japanese:"जापानी",nepali:"नेपाली",building1:"भवन 1",building2:"भवन 2",
    chooseBuilding:"हेर्न चाहेको भवन छुनुहोस्",back:"‹ फर्कनुहोस्",floors:"तला चयन",
    floor1:"तला 1",floor2:"तला 2",floor3:"तला 3",floor4:"तला 4",type:"प्रकार",capacity:"मानक संख्या",checkIn:"आगमन",
    yes:"छ",no:"छैन",adult:"वयस्क",middle:"ठूला बालबालिका",child:"साना बालबालिका",infant:"शिशु",mouth:"मुख सफाइ सामग्री",slippers:"चप्पल",
    toothbrush:"दाँत माझ्ने ब्रस",amenities:"सुविधा सामग्री",samue:"समुए पोशाक",towel:"तौलिया सेट",out:"प्रस्थान",stay:"बसाइ जारी",ck:"सी के",test:"परीक्षण"}
};
let language="ja";
try { const saved=localStorage.getItem('cleaning-web-language'); if(saved==='ja'||saved==='ne') language=saved; } catch (_) {}
function t(key){return TEXT[language][key];}
function translateType(type){
  if(language==='ja') return type;
  const letters={V:'भी',A:'ए',B:'बी',U:'यू',F:'एफ',S:'एस',J:'जे',P:'पी'};
  return [...type].map(c=>letters[c]||c).join(' ');
}
function translateNote(note){
  if(language==='ja') return note;
  return note.replace(/子供セット/g,'बालबालिकाको सामग्री सेट')
    .replace(/ベビーベッド/g,'शिशुको ओछ्यान').replace(/オムツ用ゴミ箱/g,'डाइपर फाल्ने डब्बा')
    .replace(/エキストラ寝具/g,'अतिरिक्त ओछ्यान सामग्री').replace(/N\.C/g,'एन सी')
    .replace(/CK/g,'सी के').replace(/PD/g,'पी डी').replace(/札/g,'चिन्ह')
    .replace(/（テスト）/g,' (परीक्षण)');
}
function tokyoDateParts(now){
  return Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric',weekday:'short'})
    .formatToParts(now).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
}
function formatToday(now,lang=language){
  const p=tokyoDateParts(now);
  const ja={Sun:'日',Mon:'月',Tue:'火',Wed:'水',Thu:'木',Fri:'金',Sat:'土'};
  const ne={Sun:'आइतबार',Mon:'सोमबार',Tue:'मंगलबार',Wed:'बुधबार',Thu:'बिहीबार',Fri:'शुक्रबार',Sat:'शनिबार'};
  return lang==='ne'?`${p.year} वर्ष ${p.month} महिना ${p.day} गते (${ne[p.weekday]})`:`${p.year}年${p.month}月${p.day}日（${ja[p.weekday]}）`;
}
let dateTimer;
function updateToday(){
  const now=new Date();
  const p=tokyoDateParts(now);
  const today=document.getElementById('today');
  today.textContent=formatToday(now);
  today.setAttribute('datetime',`${p.year}-${p.month.padStart(2,'0')}-${p.day.padStart(2,'0')}`);
  clearTimeout(dateTimer);
  // Schedule the next Japanese midnight, regardless of the device time zone.
  const next=Date.parse(`${p.year}-${p.month.padStart(2,'0')}-${p.day.padStart(2,'0')}T00:00:00+09:00`)+86400000;
  dateTimer=setTimeout(updateToday,Math.max(100,next-now.getTime()+100));
}
function applyLanguage(){
  document.documentElement.lang=language;
  document.title=`${t('title')} (${t('test')})`;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.i18nAria));});
  for(const lang of ['ja','ne']) document.getElementById('lang-'+lang).setAttribute('aria-pressed',String(lang===language));
  updateToday();
}
function setLanguage(lang){
  if(lang!=='ja'&&lang!=='ne') return;
  language=lang;
  try {localStorage.setItem('cleaning-web-language',language);} catch (_) {}
  applyLanguage();
  if(document.getElementById('detail').classList.contains('active')) render();
}

function goHome(){
  document.getElementById("detail").classList.remove("active");
  document.getElementById("home").classList.add("active");
  window.scrollTo({top:0,behavior:"instant"});
}
function openBuilding(id){
  current=id;
  document.getElementById("home").classList.remove("active");
  document.getElementById("detail").classList.add("active");
  render();
  window.scrollTo({top:0,behavior:"instant"});
}
function roomFloor(roomNumber){
  const number=String(roomNumber);
  return /^\d{4}$/.test(number) ? number[1] : null;
}
function jumpToFloor(floor){
  const first=DATA[current].rooms.find(r=>roomFloor(r.room)===String(floor));
  if(!first) return;
  const room=document.getElementById(`room-${first.room}`);
  const header=document.getElementById("sticky");
  if(!room || !header) return;
  // Measure the actual header height, including wrapped text and floor buttons.
  const top=window.scrollY+room.getBoundingClientRect().top-header.getBoundingClientRect().height-8;
  window.scrollTo({top:Math.max(0,top),behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
}
function noteClass(notes){
  if(notes.some(n=>n.includes("N.C") || n==="PD" || n==="CK")) return "notes yellow";
  return "notes";
}
function card(r,theme){
  const diff=r.mouth!==r.slippers;
  return `
  <article id="room-${r.room}" class="room ${theme}">
    <div class="rtop">
      <div>
        <div class="roomno">${r.room}</div>
        <div class="meta">${t("type")} ${translateType(r.type)}　/　${t("capacity")} ${r.const}</div>
      </div>
      <div class="inpill ${r.in==="○"?"on":"off"}">${t("checkIn")} ${language==="ne"?t(r.in==="○"?"yes":"no"):r.in}</div>
    </div>

    <div class="people">
      <div class="pbox"><span>${t("adult")}</span><b>${r.big}</b></div>
      <div class="pbox"><span>${t("middle")}</span><b>${r.mid}</b></div>
      <div class="pbox"><span>${t("child")}</span><b>${r.small}</b></div>
      <div class="pbox"><span>${t("infant")}</span><b>${r.infant}</b></div>
    </div>

    <div class="items">
      <div class="item ${diff?"mouthdiff":""}"><span>${t("mouth")}</span><b>${r.mouth}</b></div>
      <div class="item ${diff?"mouthdiff":""}"><span>${t("slippers")}</span><b>${r.slippers}</b></div>
      <div class="item"><span>${t("toothbrush")}</span><b>${r.toothbrush}</b></div>
      <div class="item"><span>${t("amenities")}</span><b>${r.amenities}</b></div>
      <div class="item"><span>${t("samue")}</span><b>${r.samue}</b></div>
      <div class="item"><span>${t("towel")}</span><b>${r.towel}</b></div>
    </div>

    ${r.notes.length ? `<div class="${noteClass(r.notes)}"><ul>${r.notes.map(n=>`<li>${translateNote(n)}</li>`).join("")}</ul></div>` : ""}
  </article>`;
}
function render(){
  const d=DATA[current];
  document.getElementById("floors").className=`floors ${d.theme}`;
  document.getElementById("s1").classList.toggle("active", current==="1");
  document.getElementById("s2").classList.toggle("active", current==="2");

  const hc=document.getElementById("headcard");
  hc.className=`headcard ${d.theme}`;
  hc.innerHTML=`
    <div class="headrow">
      <div class="bname">${t("building"+current)}</div>
      <div class="date">${language==="ne"?d.date.replace("（テスト）"," (परीक्षण)"):d.date}</div>
    </div>
    <div class="stats">
      <span class="stat out">${t("out")} ${d.summary.out}</span>
      <span class="stat stay">${t("stay")} ${d.summary.stay}</span>
      <span class="stat ck">${t("ck")} ${d.summary.ck}</span>
    </div>`;
  document.getElementById("rooms").innerHTML=d.rooms.map(r=>card(r,d.theme)).join("");
}
applyLanguage();
document.addEventListener('visibilitychange',()=>{if(!document.hidden) updateToday();});
window.addEventListener('focus',updateToday);
window.addEventListener('pageshow',updateToday);
</script>
</body>
</html>
